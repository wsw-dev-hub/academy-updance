# Worker "academy" — área de membros, admin, login e API da Up Dance.
# Usa o MESMO KV e o MESMO D1 do blog (recursos da conta, compartilhados).
# Segredos (definir no painel do Worker, não aqui): GMAIL_APP_PASSWORD, ADMIN_SETUP_KEY

name                = "academy"
compatibility_date  = "2026-06-17"
main                = "./worker/index.js"

[assets]
directory          = "dist"
binding            = "ASSETS"
html_handling      = "auto-trailing-slash"
not_found_handling = "404-page"

# O Worker roda primeiro em tudo, MENOS nas pastas de arquivos estáticos.
# Necessário para a portaria de /membros e /admin e para redirecionar ao blog
# a raiz "/" e os caminhos que não pertencem ao academy (lista BLOG_PREFIXES
# em worker/index.js). Com not_found_handling = "404-page", um caminho sem
# arquivo NÃO chega ao Worker a menos que esteja coberto aqui.
run_worker_first   = ["/api/*", "/admin", "/admin/*", "/ouvir/*", "/sprites/*"]

[[kv_namespaces]]
binding = "KV"
id      = "10d76ce53a5049fbab9cab01b68936e2"

[[d1_databases]]
binding       = "DB"
database_name = "updance_db"
database_id   = "191b7031-3739-449b-9d19-ba12c3c12b25"

[vars]
AMBIENTE         = "producao"
MAIL_FROM        = "Up Dance <onboarding@resend.dev>"
GMAIL_USER       = "updancexperience@gmail.com"
# Custo do hash de senha (mesmo padrão do worker do blog: 100.000).
PBKDF2_ITERACOES = "100000"

# Vídeos (bucket privado — nunca ativar r2.dev). Criar em: R2 Object Storage → Create bucket.
[[r2_buckets]]
binding     = "VIDEOS"
bucket_name = "updance-videos"

[observability]
enabled = true

# Segredos (NUNCA aqui) — painel: Settings → Variables and Secrets → Add → tipo "Secret":
#   ADMIN_SETUP_KEY     chave de /api/admin/setup (cria/redefine administrador)
#   GMAIL_APP_PASSWORD  senha de app do Gmail (e-mail de "esqueci minha senha")
